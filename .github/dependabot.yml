version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Actions maintained by GitHub itself (actions/*, github/*) are
      # released in lockstep and safe to bump together, majors included.
      github-official:
        patterns:
          - actions/*
          - github/*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The @actions toolkit is the only production dependency family.
      actions-toolkit:
        dependency-type: production
        patterns:
          - '@actions/*'
        update-types:
          - minor
          - patch
      # Lint/format chain: eslint, plugins, @typescript-eslint, prettier.
      lint:
        dependency-type: development
        patterns:
          - '*eslint*'
          - '*prettier*'
        update-types:
          - minor
          - patch
      # Test chain: jest, @jest/*, @types/jest, ts-jest*.
      test:
        dependency-type: development
        patterns:
          - '*jest*'
        update-types:
          - minor
          - patch
      # Build chain: rollup and its plugins.
      rollup:
        dependency-type: development
        patterns:
          - rollup
          - '@rollup/*'
        update-types:
          - minor
          - patch
